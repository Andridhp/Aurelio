<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurelio Care - Plataforma de Acompañamiento T21</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #F8FAFC;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-purple-100 selection:text-purple-900">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AurelioCareApp() {
      const [activeTab, setActiveTab] = useState('home');
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [mensajeVoz, setMensajeVoz] = useState('');
      const [copiado, setCopiado] = useState(false);
      const [mostrarCeleb, setMostrarCeleb] = useState(false);
      const [textoCeleb, setTextoCeleb] = useState('');

      // Datos de Perfil (Personalización)
      const [perfil, setPerfil] = useState(() => {
        const p = localStorage.getItem('aurelio_care_perfil');
        return p ? JSON.parse(p) : { nombreHijo: 'Aurelio', nombreCuidador: 'Mamá / Papá' };
      });

      useEffect(() => {
        localStorage.setItem('aurelio_care_perfil', JSON.stringify(perfil));
      }, [perfil]);

      // Bitácora Diaria
      const [registros, setRegistros] = useState(() => {
        const guardados = localStorage.getItem('aurelio_care_bitacora');
        return guardados ? JSON.parse(guardados) : [
          { id: 1, fecha: 'Hoy, 09:30 AM', categoria: 'Observación Física', nota: 'Pancita algo abultada y durita por la mañana. En el baño se usó el vertido gradual y se mantuvo tranquilo.' },
          { id: 2, fecha: 'Ayer, 04:00 PM', categoria: 'Comunicación', nota: 'Practicamos la seña de "MÁS" durante la comida. Hizo contacto visual directo.' }
        ];
      });

      const [nuevaNota, setNuevaNota] = useState('');
      const [catNuevaNota, setCatNuevaNota] = useState('Observación Física');

      useEffect(() => {
        localStorage.setItem('aurelio_care_bitacora', JSON.stringify(registros));
      }, [registros]);

      // Mapa de Pasos (Hitos sin edad)
      const [pasosEstado, setPasosEstado] = useState(() => {
        const p = localStorage.getItem('aurelio_care_pasos');
        return p ? JSON.parse(p) : {
          'mg_1': 'Consolidado',
          'mg_2': 'Practicando',
          'mg_3': 'En preparación',
          'mf_1': 'Consolidado',
          'mf_2': 'Practicando',
          'or_1': 'Consolidado',
          'or_2': 'Practicando',
          'cm_1': 'Consolidado',
          'cm_2': 'Practicando'
        };
      });

      useEffect(() => {
        localStorage.setItem('aurelio_care_pasos', JSON.stringify(pasosEstado));
      }, [pasosEstado]);

      // Motor de Sintesis de Voz
      const hablar = (texto) => {
        setMensajeVoz(texto);
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(texto);
          utterance.lang = 'es-MX';
          utterance.rate = 0.85;
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        }
        setTimeout(() => setMensajeVoz(''), 3000);
      };

      const agregarBitacora = (e) => {
        e.preventDefault();
        if (!nuevaNota.trim()) return;
        const nuevo = {
          id: Date.now(),
          fecha: new Date().toLocaleDateString('es-MX', { hour: '2-digit', minute: '2-digit' }),
          categoria: catNuevaNota,
          nota: nuevaNota
        };
        setRegistros([nuevo, ...registros]);
        setNuevaNota('');
        activarCelebracion(`¡Nota guardada! Tu dedicación en observar cada detalle es un acto de amor enorme para ${perfil.nombreHijo}. Lo estás haciendo genial, ${perfil.nombreCuidador}.`);
      };

      const cambiarEstadoPaso = (id, nuevoEstado) => {
        setPasosEstado({ ...pasosEstado, [id]: nuevoEstado });
        if (nuevoEstado === 'Consolidado') {
          activarCelebracion(`¡Un paso más consolidado! Tu paciencia y acompañamiento diario están dando frutos en el camino de ${perfil.nombreHijo}. ¡Felicidades!`);
        }
      };

      const activarCelebracion = (mensaje) => {
        setTextoCeleb(mensaje);
        setMostrarCeleb(true);
      };

      const copiarSolicitudLegal = () => {
        const textoLegal = `ASUNTO: Solicitud Formal de Ajustes Razonables
MARCO LEGAL: Artículos 61, 64 y 65 de la Ley General de Educación (México)

A la Dirección de la Institución Educativa / Coordinación USAER:

Por medio de la presente, en mi calidad de tutor legal del alumno ${perfil.nombreHijo} (Diagnóstico: Trisomía 21 / Síndrome de Down), me dirijo a ustedes para solicitar formalmente la instrumentación de los AJUSTES RAZONABLES pertinentes en su entorno de aprendizaje.

Ajustes Sugeridos:
1. Implementación de apoyos visuales y Comunicación Aumentativa (SAAC/Pictogramas).
2. Anticipación estructurada en transiciones de actividades.
3. Respeto al perfil de procesamiento sensorial (evitar estímulos auditivos o táctiles bruscos sin preparación previa).

Atentamente,
Familia de ${perfil.nombreHijo}`;

        navigator.clipboard?.writeText(textoLegal);
        setCopiado(true);
        setTimeout(() => setCopiado(false), 2500);
      };

      return (
        <div className="min-h-screen flex bg-slate-100">
          
          {/* BARRA LATERAL / NAVEGACIÓN PRINCIPAL */}
          <aside className={`bg-slate-900 text-slate-300 w-64 fixed inset-y-0 left-0 z-30 transform ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col justify-between shadow-xl`}>
            <div>
              {/* LOGO & ENCABEZADO */}
              <div className="p-5 border-b border-slate-800 flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white font-extrabold text-lg shadow-md">
                  {perfil.nombreHijo ? perfil.nombreHijo.charAt(0) : 'A'}
                </div>
                <div>
                  <h1 className="font-extrabold text-base text-white tracking-tight">Aurelio Care</h1>
                  <p className="text-xs text-purple-400 font-medium">Acompañamiento T21</p>
                </div>
              </div>

              {/* MENÚ DE NAVEGACIÓN */}
              <nav className="p-3 space-y-1">
                {[
                  { id: 'home', icon: '🏠', label: 'Inicio / Dashboard' },
                  { id: 'observacion', icon: '🔍', label: 'Observación Física' },
                  { id: 'pasos', icon: '🌱', label: 'Mapa de Pasos (Sin edad)' },
                  { id: 'comunicador', icon: '🗣️', label: 'Comunicador & Gestos' },
                  { id: 'bitacora', icon: '📝', label: 'Bitácora e Informes' },
                  { id: 'legal', icon: '⚖️', label: 'Marco Legal & Perfil' }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-xs font-bold transition ${activeTab === item.id ? 'bg-purple-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}`}
                  >
                    <span className="text-base">{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            {/* PERFIL RESUMIDO EN LA BASE */}
            <div className="p-4 border-t border-slate-800 bg-slate-950/50">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-xs">
                  👤
                </div>
                <div className="overflow-hidden">
                  <p className="text-xs font-bold text-white truncate">{perfil.nombreCuidador}</p>
                  <p className="text-[10px] text-slate-400 truncate">Cuidador de {perfil.nombreHijo}</p>
                </div>
              </div>
            </div>
          </aside>

          {/* CONTENIDO PRINCIPAL */}
          <div className="flex-1 md:ml-64 flex flex-col min-h-screen">
            
            {/* BARRA SUPERIOR DE ACCIONES */}
            <header className="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20 shadow-xs">
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setSidebarOpen(!sidebarOpen)}
                  className="md:hidden p-2 rounded-lg bg-slate-100 text-slate-600 font-bold text-sm"
                >
                  ☰
                </button>
                <h2 className="text-sm font-extrabold text-slate-800 uppercase tracking-wider">
                  {activeTab === 'home' && 'Inicio y Panorama General'}
                  {activeTab === 'observacion' && 'Observación Física y Sensorial'}
                  {activeTab === 'pasos' && 'Mapa de Progreso por Pasos (Sin Edad)'}
                  {activeTab === 'comunicador' && 'Comunicación Aumentativa y Baby Signs'}
                  {activeTab === 'bitacora' && 'Bitácora Inteligente e Informes Semanales'}
                  {activeTab === 'legal' && 'Resguardo Legal y Perfil'}
                </h2>
              </div>

              <button 
                onClick={() => hablar(`Hola ${perfil.nombreCuidador}, el sistema de voz de Aurelio Care está funcionando correctamente.`)}
                className="px-3.5 py-2 bg-purple-50 hover:bg-purple-100 text-purple-800 rounded-xl text-xs font-bold transition flex items-center gap-2 border border-purple-200"
              >
                🔊 Probar Voz
              </button>
            </header>

            {/* ALERTA DE VOZ ACTIVA */}
            {mensajeVoz && (
              <div className="bg-purple-900 text-white px-6 py-2.5 text-center text-xs font-bold animate-pulse flex items-center justify-center gap-2">
                <span>🗣️ Reproduciendo mensaje:</span>
                <span className="italic">"{mensajeVoz}"</span>
              </div>
            )}

            {/* MODAL DE CELEBRACIÓN Y APOYO EMOCIONAL */}
            {mostrarCeleb && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl border border-purple-100">
                  <div className="text-5xl">🌟</div>
                  <h3 className="font-extrabold text-slate-900 text-base">¡Un recordatorio especial!</h3>
                  <p className="text-xs text-slate-600 leading-relaxed">{textoCeleb}</p>
                  <button 
                    onClick={() => setMostrarCeleb(false)}
                    className="w-full py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-xs transition"
                  >
                    Entendido
                  </button>
                </div>
              </div>
            )}

            {/* ÁREA DE CONTENIDO DINÁMICO */}
            <main className="p-6 max-w-5xl w-full mx-auto space-y-6 flex-1">

              {/* 1. HOME / DASHBOARD */}
              {activeTab === 'home' && (
                <div className="space-y-6">

                  {/* BANNER DE BIENVENIDA Y SOSTEN EMOCIONAL */}
                  <div className="bg-gradient-to-r from-purple-700 via-indigo-700 to-slate-900 rounded-3xl p-6 text-white shadow-lg space-y-3">
                    <div className="inline-block bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider text-purple-200">
                      Refugio de Acompañamiento
                    </div>
                    <h1 className="text-xl font-extrabold">Bienvenido/a, {perfil.nombreCuidador}</h1>
                    <p className="text-xs text-purple-100 max-w-2xl leading-relaxed">
                      Cuidar, observar y acompañar a {perfil.nombreHijo} exige un esfuerzo tremendo. Aquí no estás a solas: cuentas con una guía clara para registrar su evolución, sin comparaciones ni presiones de tiempo.
                    </p>
                  </div>

                  {/* TARJETA DE AVISO DE SEGURIDAD E INTEGRIDAD FÍSICA */}
                  <div className="bg-rose-50 border border-rose-200/80 rounded-2xl p-4 flex gap-3 items-start">
                    <div className="text-xl">⚠️</div>
                    <div className="space-y-1">
                      <h4 className="font-bold text-xs text-rose-900">Prioridad en la Seguridad de {perfil.nombreHijo}</h4>
                      <p className="text-xs text-rose-800 leading-relaxed">
                        Cada sugerencia o actividad debe ser respetuosa con la comodidad e integridad física del niño. Si notas molestia, llanto o resistencia, suspende la dinámica y consúltala con su pediatra o especialista de cabecera.
                      </p>
                    </div>
                  </div>

                  {/* TARJETAS DE ACCESO RÁPIDO */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    
                    <div 
                      onClick={() => setActiveTab('observacion')}
                      className="bg-white p-5 rounded-2xl border border-slate-200 hover:border-purple-300 shadow-xs cursor-pointer transition space-y-2 group"
                    >
                      <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber-700 flex items-center justify-center font-bold text-lg group-hover:scale-110 transition">
                        🔍
                      </div>
                      <h3 className="font-extrabold text-sm text-slate-800">Observación Física</h3>
                      <p className="text-xs text-slate-500 leading-relaxed">
                        Monitorea pancita, boca, oídos y postura en lenguaje claro sin tecnicismos pesados.
                      </p>
                    </div>

                    <div 
                      onClick={() => setActiveTab('pasos')}
                      className="bg-white p-5 rounded-2xl border border-slate-200 hover:border-purple-300 shadow-xs cursor-pointer transition space-y-2 group"
                    >
                      <div className="w-10 h-10 rounded-xl bg-purple-50 text-purple-700 flex items-center justify-center font-bold text-lg group-hover:scale-110 transition">
                        🌱
                      </div>
                      <h3 className="font-extrabold text-sm text-slate-800">Mapa de Pasos (Sin Edad)</h3>
                      <p className="text-xs text-slate-500 leading-relaxed">
                        Acompaña la secuencia del desarrollo por escalones sin la presión de un calendario de meses.
                      </p>
                    </div>

                    <div 
                      onClick={() => setActiveTab('bitacora')}
                      className="bg-white p-5 rounded-2xl border border-slate-200 hover:border-purple-300 shadow-xs cursor-pointer transition space-y-2 group"
                    >
                      <div className="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-700 flex items-center justify-center font-bold text-lg group-hover:scale-110 transition">
                        📝
                      </div>
                      <h3 className="font-extrabold text-sm text-slate-800">Informes Semanales</h3>
                      <p className="text-xs text-slate-500 leading-relaxed">
                        Agrupa las notas de la semana listas para llevar a la consulta médica o terapéutica.
                      </p>
                    </div>

                  </div>

                </div>
              )}

              {/* 2. OBSERVACIÓN FÍSICA Y SENSORIAL */}
              {activeTab === 'observacion' && (
                <div className="space-y-6">
                  
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-2">
                    <h2 className="font-extrabold text-base text-slate-900">Guía de Observación Clínica Cotidiana</h2>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      Diseñada para identificar señales físicas o sensoriales clave en casa, traducidas a un lenguaje accesible para compartir objetivamente con el equipo médico.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    
                    {/* Pancita */}
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-3 shadow-xs">
                      <div className="flex justify-between items-center">
                        <span className="font-extrabold text-xs text-amber-900 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
                          🥣 Pancita y Digestión
                        </span>
                      </div>
                      <h3 className="font-bold text-sm text-slate-800">Observación de firmeza abdominal</h3>
                      <p className="text-xs text-slate-600 leading-relaxed">
                        ¿Sientes su panza abultada o dura al tacto? El tono muscular suave en la pared de su vientre y el tránsito lento pueden influir.
                      </p>
                      <div className="bg-amber-50/60 p-3 rounded-xl text-xs text-amber-950 border border-amber-100">
                        💡 <strong>Para la consulta:</strong> Apuntar si la firmeza varía durante el día o si muestra molestia al tocarlo.
                      </div>
                    </div>

                    {/* Orofacial */}
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-3 shadow-xs">
                      <div className="flex justify-between items-center">
                        <span className="font-extrabold text-xs text-teal-900 bg-teal-50 px-3 py-1 rounded-full border border-teal-200">
                          👄 Boca y Lengua (Orofacial)
                        </span>
                      </div>
                      <h3 className="font-bold text-sm text-slate-800">Sellado labial y masticación</h3>
                      <p className="text-xs text-slate-600 leading-relaxed">
                        ¿Mantiene los labios entreabiertos en reposo? ¿Hay escape de líquido al beber de un vaso?
                      </p>
                      <div className="bg-teal-50/60 p-3 rounded-xl text-xs text-teal-950 border border-teal-100">
                        💡 <strong>Estrategia en casa:</strong> Usar vasos pequeños con borde suave y ofrecer texturas que ejerciten los músculos masticatorios.
                      </div>
                    </div>

                    {/* Oídos */}
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-3 shadow-xs">
                      <div className="flex justify-between items-center">
                        <span className="font-extrabold text-xs text-blue-900 bg-blue-50 px-3 py-1 rounded-full border border-blue-200">
                          👂 Oídos y Audición
                        </span>
                      </div>
                      <h3 className="font-bold text-sm text-slate-800">Sensibilidad sonora y molestias</h3>
                      <p className="text-xs text-slate-600 leading-relaxed">
                        ¿Se toca la orejita con frecuencia? ¿Reacciona con molestia o susto exagerado ante ruidos fuertes repentinos?
                      </p>
                    </div>

                    {/* Postura */}
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-3 shadow-xs">
                      <div className="flex justify-between items-center">
                        <span className="font-extrabold text-xs text-purple-900 bg-purple-50 px-3 py-1 rounded-full border border-purple-200">
                          🦶 Postura y Apoyo
                        </span>
                      </div>
                      <h3 className="font-bold text-sm text-slate-800">Alineación al ponerse de pie</h3>
                      <p className="text-xs text-slate-600 leading-relaxed">
                        ¿Separa mucho los pies para buscar estabilidad? ¿Observas que el tobillo se incline un poco hacia adentro?
                      </p>
                    </div>

                  </div>

                </div>
              )}

              {/* 3. MAPA DE PASOS (HITOS SIN EDAD) */}
              {activeTab === 'pasos' && (
                <div className="space-y-6">

                  <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-2">
                    <h2 className="font-extrabold text-base text-slate-900">Mapa de Progreso por Pasos (Sin Edad)</h2>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      Basado en la evidencia científica del desarrollo T21, este módulo elimina las presiones de calendario para centrarse en la secuencia lógica de maduración.
                    </p>
                  </div>

                  {/* Motor Grueso */}
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4 shadow-xs">
                    <h3 className="font-extrabold text-sm text-purple-900 uppercase tracking-wider">1. Fuerza y Movimiento (Motor Grueso)</h3>
                    
                    <div className="space-y-3">
                      {[
                        { id: 'mg_1', titulo: 'Paso 1: Sostén Cefálico (Cabeza y Cuello)', desc: 'Mantiene la cabeza firme estando boca abajo o levantado en brazos.' },
                        { id: 'mg_2', titulo: 'Paso 2: Sostén de Tronco (Sentado)', desc: 'Se mantiene erguido sentado con apoyo suave de cojines o tus manos.' },
                        { id: 'mg_3', titulo: 'Paso 3: Desplazamiento por el Suelo', desc: 'Se gira, se arrastra o inicia el gateo para alcanzar objetos que le atraen.' }
                      ].map((p) => (
                        <div key={p.id} className="p-4 rounded-xl border border-slate-100 bg-slate-50/50 flex flex-col md:flex-row md:items-center justify-between gap-3">
                          <div>
                            <strong className="text-xs font-bold text-slate-800 block">{p.titulo}</strong>
                            <p className="text-xs text-slate-500">{p.desc}</p>
                          </div>
                          <div className="flex gap-2 text-xs">
                            {['En preparación', 'Practicando', 'Consolidado'].map((est) => (
                              <button
                                key={est}
                                onClick={() => cambiarEstadoPaso(p.id, est)}
                                className={`px-3 py-1.5 rounded-xl font-bold transition ${pasosEstado[p.id] === est ? 'bg-purple-600 text-white shadow-xs' : 'bg-white text-slate-600 border border-slate-200'}`}
                              >
                                {est}
                              </button>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Orofacial */}
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4 shadow-xs">
                    <h3 className="font-extrabold text-sm text-teal-900 uppercase tracking-wider">2. Maduración Orofacial y Alimentación</h3>
                    
                    <div className="space-y-3">
                      {[
                        { id: 'or_1', titulo: 'Paso 1: Deglución de Consistencias Suaves', desc: 'Traga purés suaves sin expulsar la comida con la lengua.' },
                        { id: 'or_2', titulo: 'Paso 2: Masticación e Integración de Grumos', desc: 'Acepta alimentos machacados con tenedor realizando movimientos laterales suaves.' }
                      ].map((p) => (
                        <div key={p.id} className="p-4 rounded-xl border border-slate-100 bg-slate-50/50 flex flex-col md:flex-row md:items-center justify-between gap-3">
                          <div>
                            <strong className="text-xs font-bold text-slate-800 block">{p.titulo}</strong>
                            <p className="text-xs text-slate-500">{p.desc}</p>
                          </div>
                          <div className="flex gap-2 text-xs">
                            {['En preparación', 'Practicando', 'Consolidado'].map((est) => (
                              <button
                                key={est}
                                onClick={() => cambiarEstadoPaso(p.id, est)}
                                className={`px-3 py-1.5 rounded-xl font-bold transition ${pasosEstado[p.id] === est ? 'bg-teal-600 text-white shadow-xs' : 'bg-white text-slate-600 border border-slate-200'}`}
                              >
                                {est}
                              </button>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              )}

              {/* 4. COMUNICADOR SAAC & BABY SIGNS */}
              {activeTab === 'comunicador' && (
                <div className="space-y-6">

                  <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-2">
                    <h2 className="font-extrabold text-base text-slate-900">Comunicación Aumentativa e Intención Comunicativa</h2>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      Usa los pictogramas interactivos para darle voz inmediata a las necesidades de {perfil.nombreHijo} o practica las señas puente para reducir la frustración.
                    </p>
                  </div>

                  {/* Tablero SAAC */}
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4 shadow-xs">
                    <h3 className="font-extrabold text-xs text-slate-400 uppercase tracking-wider">Tablero Digital de Voz</h3>
                    
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 gap-3">
                      {[
                        { emoji: '🍼', titulo: 'Leche', frase: 'Quiero mi leche por favor' },
                        { emoji: '🚽', titulo: 'Baño', frase: 'Necesito ir al baño' },
                        { emoji: '🛌', titulo: 'Dormir', frase: 'Tengo mucho sueño' },
                        { emoji: '🧸', titulo: 'Jugar', frase: 'Quiero jugar con mis juguetes' },
                        { emoji: '🫂', titulo: 'Abrazo', frase: 'Necesito un abrazo' },
                        { emoji: '🛑', titulo: 'Parar / No', frase: 'No quiero más, por favor para' },
                        { emoji: '🎵', titulo: 'Música', frase: 'Pon mi música favorita' },
                        { emoji: '🌳', titulo: 'Paseo', frase: 'Quiero salir a dar un paseo' },
                        { emoji: '✨', titulo: 'Más', frase: 'Quiero más de esto' }
                      ].map((p, idx) => (
                        <button 
                          key={idx}
                          onClick={() => hablar(p.frase)}
                          className="p-4 bg-slate-50 border border-slate-200 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-purple-50 hover:border-purple-300 active:scale-95 transition group"
                        >
                          <span className="text-4xl group-hover:scale-110 transition">{p.emoji}</span>
                          <span className="font-extrabold text-xs text-slate-800">{p.titulo}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Biblioteca Baby Signs */}
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-3 shadow-xs">
                    <h3 className="font-extrabold text-xs text-slate-400 uppercase tracking-wider">Biblioteca de Baby Signs (Señas Puente)</h3>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-1">
                        <strong className="text-purple-700 font-bold block text-sm">Seña: "MÁS"</strong>
                        <p className="text-slate-600 leading-relaxed">Juntar suavemente las yemas de los dedos de ambas manos frente al pecho varias veces.</p>
                      </div>
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-1">
                        <strong className="text-purple-700 font-bold block text-sm">Seña: "AGUA"</strong>
                        <p className="text-slate-600 leading-relaxed">Formar la letra W con los dedos índice, medio y anular, realizando toques suaves en la barbilla.</p>
                      </div>
                    </div>
                  </div>

                </div>
              )}

              {/* 5. BITÁCORA E INFORMES */}
              {activeTab === 'bitacora' && (
                <div className="space-y-6">

                  {/* Creador de notas */}
                  <form onSubmit={agregarBitacora} className="bg-white p-6 rounded-2xl border border-slate-200 space-y-3 shadow-xs">
                    <h3 className="font-extrabold text-sm text-slate-800">Registrar Nueva Observación</h3>
                    
                    <div className="flex gap-2 overflow-x-auto pb-1">
                      {['Observación Física', 'Comunicación', 'Sensorial', 'Terapia'].map((cat) => (
                        <button
                          type="button"
                          key={cat}
                          onClick={() => setCatNuevaNota(cat)}
                          className={`text-xs font-bold px-3 py-1.5 rounded-xl whitespace-nowrap transition ${catNuevaNota === cat ? 'bg-purple-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>

                    <textarea 
                      value={nuevaNota}
                      onChange={(e) => setNuevaNota(e.target.value)}
                      placeholder={`Describe lo que notaste en ${perfil.nombreHijo} hoy (firmeza de pancita, uso del vaso, seña realizada)...`}
                      className="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-purple-500 bg-slate-50 resize-none h-24"
                    ></textarea>

                    <button 
                      type="submit"
                      className="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-xs shadow-md transition"
                    >
                      + Guardar Registro
                    </button>
                  </form>

                  {/* INFORME SEMANAL LISTO PARA ESPECIALISTAS */}
                  <div className="bg-gradient-to-br from-purple-900 to-indigo-950 p-6 rounded-2xl text-white space-y-3 shadow-lg">
                    <div className="flex justify-between items-center">
                      <span className="bg-purple-500/30 text-purple-200 text-xs font-bold px-3 py-1 rounded-full uppercase border border-purple-400/30">
                        Informe Semanal Consolidado
                      </span>
                      <span className="text-xs text-purple-300">Generado para la consulta</span>
                    </div>

                    <h3 className="font-extrabold text-base">Resumen de Seguimiento para {perfil.nombreHijo}</h3>
                    <p className="text-xs text-purple-200 leading-relaxed max-w-xl">
                      Organizamos tus registros en un formato claro para optimizar el tiempo de diálogo con pediatras, terapeutas o educadores.
                    </p>

                    <div className="bg-white/10 backdrop-blur-md p-4 rounded-xl border border-white/10 text-xs space-y-2">
                      <p className="font-bold text-purple-200">📌 Puntos Destacados para Consulta:</p>
                      <ul className="list-disc pl-5 space-y-1 text-purple-100">
                        <li>Firmeza abultada en la pancita observada durante el período matutino.</li>
                        <li>Progreso en sellado labial y uso progresivo de la seña de "MÁS".</li>
                      </ul>
                    </div>
                  </div>

                  {/* Historial */}
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-3 shadow-xs">
                    <h4 className="font-extrabold text-xs text-slate-400 uppercase tracking-wider">Historial de Registros</h4>
                    <div className="space-y-2">
                      {registros.map((item) => (
                        <div key={item.id} className="p-3.5 bg-slate-50 rounded-xl border border-slate-100 space-y-1">
                          <div className="flex justify-between items-center text-xs">
                            <span className="font-bold text-purple-700 bg-purple-100/60 px-2.5 py-0.5 rounded-md">
                              {item.categoria}
                            </span>
                            <span className="text-slate-400 text-[11px]">{item.fecha}</span>
                          </div>
                          <p className="text-xs text-slate-700 leading-relaxed">{item.nota}</p>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              )}

              {/* 6. MARCO LEGAL Y PERFIL */}
              {activeTab === 'legal' && (
                <div className="space-y-6">

                  {/* Configuración */}
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4 shadow-xs">
                    <h3 className="font-extrabold text-sm text-slate-800">Perfil y Nombres Personalizados</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Nombre del hijo/a:</label>
                        <input 
                          type="text" 
                          value={perfil.nombreHijo}
                          onChange={(e) => setPerfil({ ...perfil, nombreHijo: e.target.value })}
                          className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-purple-500"
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">¿Cómo quieres que te llamemos?:</label>
                        <input 
                          type="text" 
                          value={perfil.nombreCuidador}
                          onChange={(e) => setPerfil({ ...perfil, nombreCuidador: e.target.value })}
                          className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-purple-500"
                        />
                      </div>
                    </div>
                  </div>

                  {/* Carta Legal */}
                  <div className="bg-emerald-950 p-6 rounded-2xl text-white space-y-3 shadow-lg">
                    <span className="bg-emerald-800/60 text-emerald-200 text-xs font-bold px-3 py-1 rounded-full uppercase border border-emerald-700">
                      Educación Inclusiva - LGE México
                    </span>
                    <h3 className="font-extrabold text-base">Solicitud Formal de Ajustes Razonables</h3>
                    <p className="text-xs text-emerald-200 leading-relaxed max-w-xl">
                      Fundamentado en los **Artículos 61 y 64 de la Ley General de Educación de México**, respaldando el derecho de {perfil.nombreHijo} a recibir adaptaciones educativas oportunas.
                    </p>

                    <button 
                      onClick={copiarSolicitudLegal}
                      className="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl text-xs transition shadow-md flex items-center gap-2"
                    >
                      {copiado ? '¡Copiado al Portapapeles! ✅' : '📋 Copiar Carta Completa para Escuela / USAER'}
                    </button>
                  </div>

                </div>
              )}

            </main>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AurelioCareApp />);
  </script>
</body>
</html>
