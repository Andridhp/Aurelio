<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aurelio Care - Plataforma de Acompañamiento T21</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #F8F6F0;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-purple-100 selection:text-purple-900">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AurelioCareApp() {
      // Estado de navegación
      const [activeTab, setActiveTab] = useState('inicio');
      const [mensajeVoz, setMensajeVoz] = useState('');
      const [copiado, setCopiado] = useState(false);
      const [mostrarCeleb, setMostrarCeleb] = useState(false);
      const [textoCeleb, setTextoCeleb] = useState('');

      // Datos de Perfil (Personalización)
      const [perfil, setPerfil] = useState(() => {
        const p = localStorage.getItem('aurelio_care_perfil');
        return p ? JSON.parse(p) : { nombreHijo: 'Aurelio', nombreCuidador: 'Mamá/Papá' };
      });

      // Guardar perfil
      useEffect(() => {
        localStorage.setItem('aurelio_care_perfil', JSON.stringify(perfil));
      }, [perfil]);

      // Bitácora Diaria almacenada en LocalStorage
      const [registros, setRegistros] = useState(() => {
        const guardados = localStorage.getItem('aurelio_care_bitacora');
        return guardados ? JSON.parse(guardados) : [
          { id: 1, fecha: 'Hoy, 09:30 AM', categoria: 'Observación Física', nota: 'Notamos la pancita algo abultada y durita por la mañana. En el baño se usó la jarra suave con agua tibia y se mantuvo tranquilo.' },
          { id: 2, fecha: 'Ayer, 04:00 PM', categoria: 'Comunicación', nota: 'Practicamos la seña de "MÁS" durante la comida. Hizo contacto visual directo.' }
        ];
      });

      const [nuevaNota, setNuevaNota] = useState('');
      const [catNuevaNota, setCatNuevaNota] = useState('Observación Física');

      useEffect(() => {
        localStorage.setItem('aurelio_care_bitacora', JSON.stringify(registros));
      }, [registros]);

      // Mapa de Pasos (Hitos sin edad)
      const [pasosEstado, setPasosEstado] = useState(() => {
        const p = localStorage.getItem('aurelio_care_pasos');
        return p ? JSON.parse(p) : {
          'mg_1': 'Consolidado',
          'mg_2': 'Practicando',
          'mg_3': 'En preparación',
          'mf_1': 'Consolidado',
          'mf_2': 'Practicando',
          'or_1': 'Consolidado',
          'or_2': 'Practicando',
          'cm_1': 'Consolidado',
          'cm_2': 'Practicando'
        };
      });

      useEffect(() => {
        localStorage.setItem('aurelio_care_pasos', JSON.stringify(pasosEstado));
      }, [pasosEstado]);

      // Motor de Sintesis de Voz
      const hablar = (texto) => {
        setMensajeVoz(texto);
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(texto);
          utterance.lang = 'es-MX';
          utterance.rate = 0.85;
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        }
        setTimeout(() => setMensajeVoz(''), 3000);
      };

      // Guardar nota en bitácora
      const agregarBitacora = (e) => {
        e.preventDefault();
        if (!nuevaNota.trim()) return;
        const nuevo = {
          id: Date.now(),
          fecha: new Date().toLocaleDateString('es-MX', { hour: '2-digit', minute: '2-digit' }),
          categoria: catNuevaNota,
          nota: nuevaNota
        };
        setRegistros([nuevo, ...registros]);
        setNuevaNota('');
        
        // Mensaje de validación emocional al registrar
        activarCelebracion(`¡Nota guardada! Tu constancia en observar cada detalle es un acto de amor enorme para ${perfil.nombreHijo}. Lo estás haciendo excelente, ${perfil.nombreCuidador}.`);
      };

      const cambiarEstadoPaso = (id, nuevoEstado) => {
        setPasosEstado({ ...pasosEstado, [id]: nuevoEstado });
        if (nuevoEstado === 'Consolidado') {
          activarCelebracion(`¡Un paso más consolidado! Tu acompañamiento y paciencia están dando frutos en el desarrollo de ${perfil.nombreHijo}. ¡Felicidades, ${perfil.nombreCuidador}!`);
        }
      };

      const activarCelebracion = (mensaje) => {
        setTextoCeleb(mensaje);
        setMostrarCeleb(true);
      };

      const copiarSolicitudLegal = () => {
        const textoLegal = `ASUNTO: Solicitud Formal de Ajustes Razonables
MARCO LEGAL: Artículos 61, 64 y 65 de la Ley General de Educación (México)

A la Dirección de la Institución Educativa / Coordinación USAER:

Por medio de la presente, en mi calidad de madre/padre/tutor legal del alumno ${perfil.nombreHijo} (Diagnóstico: Trisomía 21 / Síndrome de Down), me dirijo a ustedes para solicitar formalmente la instrumentación de los AJUSTES RAZONABLES pertinentes en su entorno de atención y aprendizaje.

Ajustes Sugeridos:
1. Implementación de apoyos visuales y Comunicación Aumentativa (SAAC/Pictogramas).
2. Anticipación estructurada en transiciones de actividades.
3. Respeto al perfil de procesamiento sensorial (evitar estímulos auditivos o táctiles bruscos sin preparación previa).

Atentamente,
Familia de ${perfil.nombreHijo}`;

        navigator.clipboard?.writeText(textoLegal);
        setCopiado(true);
        setTimeout(() => setCopiado(false), 2500);
      };

      return (
        <div className="max-w-md mx-auto bg-white min-h-screen flex flex-col justify-between shadow-xl relative border-x border-slate-100">
          
          {/* CABECERA PRINCIPAL */}
          <header className="sticky top-0 bg-white/95 backdrop-blur-md px-4 py-3 border-b border-slate-100 flex items-center justify-between z-20">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-2xl bg-purple-600 flex items-center justify-center font-extrabold text-white text-base shadow-sm">
                {perfil.nombreHijo ? perfil.nombreHijo.charAt(0) : 'A'}
              </div>
              <div>
                <h1 className="font-bold text-sm text-slate-900 leading-tight">Aurelio Care</h1>
                <p className="text-[11px] text-purple-700 font-medium">Acompañando a {perfil.nombreHijo}</p>
              </div>
            </div>

            <button 
              onClick={() => hablar(`Aurelio Care está listo para ayudarte, ${perfil.nombreCuidador}`)}
              className="px-3 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-800 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 border border-purple-100"
            >
              🔊 Prueba Voz
            </button>
          </header>

          {/* ALERTA DE VOZ */}
          {mensajeVoz && (
            <div className="bg-purple-900 text-white px-4 py-2 text-center text-xs font-bold animate-pulse flex items-center justify-center gap-2">
              <span>🗣️ Reproduciendo:</span>
              <span className="italic">"{mensajeVoz}"</span>
            </div>
          )}

          {/* MODAL DE CELEBRACIÓN Y APOYO EMOCIONAL */}
          {mostrarCeleb && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-5 max-w-xs w-full text-center space-y-3 shadow-2xl border border-purple-100 animate-bounce-short">
                <div className="text-4xl">🌟</div>
                <h3 className="font-extrabold text-slate-900 text-sm">¡Lo estás haciendo increíble!</h3>
                <p className="text-xs text-slate-600 leading-relaxed">{textoCeleb}</p>
                <button 
                  onClick={() => setMostrarCeleb(false)}
                  className="w-full py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-xs transition"
                >
                  Continuar
                </button>
              </div>
            </div>
          )}

          {/* CONTENIDO PRINCIPAL DESPLAZABLE */}
          <main className="flex-1 p-4 overflow-y-auto space-y-4 custom-scrollbar pb-24">

            {/* SECCIÓN 1: INICIO & OBSERVACIÓN FÍSICA */}
            {activeTab === 'inicio' && (
              <div className="space-y-4">

                {/* AVISO DE SEGURIDAD E INTEGRIDAD FÍSICA */}
                <div className="bg-rose-50 rounded-2xl p-3.5 border border-rose-200/80 space-y-1">
                  <div className="flex items-center gap-1.5 text-rose-900 font-bold text-xs">
                    <span>⚠️</span>
                    <span>Prioridad en la Seguridad de {perfil.nombreHijo}</span>
                  </div>
                  <p className="text-[11px] text-rose-800 leading-relaxed">
                    Ninguna sugerencia o actividad debe forzarse ni poner en riesgo la comodidad o la integridad física del niño. Si notas molestia, llanto o resistencia, suspende la dinámica y consúltala con su pediatra o especialista.
                  </p>
                </div>

                {/* MENSAJE DE BIENVENIDA Y ACOMPAÑAMIENTO */}
                <div className="bg-gradient-to-r from-purple-600 to-indigo-600 rounded-2xl p-4 text-white space-y-1 shadow-md">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-purple-200">Refugio de Acompañamiento</span>
                  <h2 className="font-extrabold text-sm">Hola, {perfil.nombreCuidador}</h2>
                  <p className="text-xs text-purple-100 leading-relaxed">
                    Observar sin normalizar el malestar es el primer paso para entender lo que {perfil.nombreHijo} nos comunica con su cuerpo. No estás a solas en este camino.
                  </p>
                </div>

                {/* ÁREA FÍSICA DE OBSERVACIÓN */}
                <div className="space-y-2">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-xs text-slate-500 uppercase tracking-wider">Observación Física en Casa</h3>
                    <span className="text-[10px] text-purple-700 font-medium">Sin tecnicismos</span>
                  </div>

                  {/* Fichas de observación */}
                  <div className="space-y-2 text-xs">
                    
                    {/* Pancita / Digestión */}
                    <div className="bg-amber-50/70 p-3.5 rounded-2xl border border-amber-200/70 space-y-1.5">
                      <div className="flex justify-between items-center">
                        <strong className="text-amber-950 font-bold flex items-center gap-1">🥣 La Pancita y Digestión</strong>
                        <span className="text-[10px] bg-amber-200/80 text-amber-900 px-2 py-0.5 rounded-full font-bold">Observar dureza</span>
                      </div>
                      <p className="text-slate-700 leading-relaxed text-[11px]">
                        <strong>¿Qué mirar?:</strong> ¿Sientes su panza abultada o durita al tacto, incluso después de ir al baño? Recuerda que el tono muscular suave en la pared de su vientre y el tránsito lento pueden influir.
                      </p>
                      <div className="bg-white/80 p-2 rounded-xl text-[10px] text-slate-600 border border-amber-100">
                        💡 <strong>Para la consulta:</strong> Comentar si la firmeza en la pancita cambia según la hora o si hay molestia al tocarlo.
                      </div>
                    </div>

                    {/* Boca y Lengua */}
                    <div className="bg-teal-50/70 p-3.5 rounded-2xl border border-teal-200/70 space-y-1.5">
                      <div className="flex justify-between items-center">
                        <strong className="text-teal-950 font-bold flex items-center gap-1">👄 Boca y Lengua (Orofacial)</strong>
                        <span className="text-[10px] bg-teal-200/80 text-teal-900 px-2 py-0.5 rounded-full font-bold">Sellado de labios</span>
                      </div>
                      <p className="text-slate-700 leading-relaxed text-[11px]">
                        <strong>¿Qué mirar?:</strong> ¿Mantiene los labios entreabiertos al concentrarse o dormir? ¿Se escapa un poco de agua al beber del vaso?
                      </p>
                      <div className="bg-white/80 p-2 rounded-xl text-[10px] text-slate-600 border border-teal-100">
                        💡 <strong>Apoyo en casa:</strong> Usar vasos pequeños con borde suave y ofrecer alimentos con texturas variadas para fortalecer sus mejillas y labios.
                      </div>
                    </div>

                    {/* Oídos y Audición */}
                    <div className="bg-blue-50/70 p-3.5 rounded-2xl border border-blue-200/70 space-y-1.5">
                      <div className="flex justify-between items-center">
                        <strong className="text-blue-950 font-bold flex items-center gap-1">👂 Oídos y Sensibilidad</strong>
                        <span className="text-[10px] bg-blue-200/80 text-blue-900 px-2 py-0.5 rounded-full font-bold">Respuesta al sonido</span>
                      </div>
                      <p className="text-slate-700 leading-relaxed text-[11px]">
                        <strong>¿Qué mirar?:</strong> ¿Se toca o se jala con frecuencia la orejita? ¿Se inquieta con ruidos fuertes o repentinos (licuadora, cohetes)?
                      </p>
                    </div>

                    {/* Marcha y Postura */}
                    <div className="bg-purple-50/70 p-3.5 rounded-2xl border border-purple-200/70 space-y-1.5">
                      <div className="flex justify-between items-center">
                        <strong className="text-purple-950 font-bold flex items-center gap-1">🦶 Caminar y Postura</strong>
                        <span className="text-[10px] bg-purple-200/80 text-purple-900 px-2 py-0.5 rounded-full font-bold">Apoyo y equilibrio</span>
                      </div>
                      <p className="text-slate-700 leading-relaxed text-[11px]">
                        <strong>¿Qué mirar?:</strong> ¿Abre los piecitos hacia los lados para buscar mayor equilibrio al ponerse de pie? ¿Se vence un poco el tobillo hacia adentro?
                      </p>
                    </div>

                  </div>
                </div>

              </div>
            )}

            {/* SECCIÓN 2: MAPA DE PASOS (HITOS SIN EDAD) */}
            {activeTab === 'pasos' && (
              <div className="space-y-4">
                
                <div className="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-1">
                  <h2 className="font-extrabold text-xs text-slate-900">Mapa de Progreso por Pasos (Sin Edad)</h2>
                  <p className="text-[11px] text-slate-600 leading-relaxed">
                    Cada camino es único. Este mapa muestra la secuencia de consolidación sin presiones de meses ni calendario. Marca el estado de cada paso a su propio ritmo.
                  </p>
                </div>

                {/* Categoría: Motor Grueso */}
                <div className="space-y-2">
                  <h3 className="font-bold text-xs text-purple-800 uppercase tracking-wider">Movimiento y Fuerza (Motor Grueso)</h3>
                  
                  {[
                    { id: 'mg_1', titulo: 'Paso 1: Sostén de Cabeza', desc: 'Sostiene la cabeza firmemente al estar en brazos o boca abajo.' },
                    { id: 'mg_2', titulo: 'Paso 2: Sentado con Apoyo', desc: 'Se mantiene sentado con ayuda de cojines o tus manos sostenidas.' },
                    { id: 'mg_3', titulo: 'Paso 3: Desplazamiento por el Suelo', desc: 'Se gira, se arrastra o inicia el gateo para alcanzar juguetes.' }
                  ].map((p) => (
                    <div key={p.id} className="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-xs space-y-2">
                      <div>
                        <strong className="text-xs text-slate-800 block">{p.titulo}</strong>
                        <p className="text-[11px] text-slate-500">{p.desc}</p>
                      </div>

                      <div className="flex gap-1.5 text-[10px]">
                        {['En preparación', 'Practicando', 'Consolidado'].map((est) => (
                          <button
                            key={est}
                            onClick={() => cambiarEstadoPaso(p.id, est)}
                            className={`px-2.5 py-1 rounded-xl font-bold transition ${pasosEstado[p.id] === est ? 'bg-purple-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                          >
                            {est}
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>

                {/* Categoría: Orofacial y Alimentación */}
                <div className="space-y-2">
                  <h3 className="font-bold text-xs text-teal-800 uppercase tracking-wider">Boca y Alimentación</h3>
                  
                  {[
                    { id: 'or_1', titulo: 'Paso 1: Trago de Purés Suaves', desc: 'Traga alimentos papilla/puré sin expulsar todo con la lengua.' },
                    { id: 'or_2', titulo: 'Paso 2: Integración de Grumos', desc: 'Acepta alimentos machacados con tenedor realizando masticación suave.' }
                  ].map((p) => (
                    <div key={p.id} className="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-xs space-y-2">
                      <div>
                        <strong className="text-xs text-slate-800 block">{p.titulo}</strong>
                        <p className="text-[11px] text-slate-500">{p.desc}</p>
                      </div>

                      <div className="flex gap-1.5 text-[10px]">
                        {['En preparación', 'Practicando', 'Consolidado'].map((est) => (
                          <button
                            key={est}
                            onClick={() => cambiarEstadoPaso(p.id, est)}
                            className={`px-2.5 py-1 rounded-xl font-bold transition ${pasosEstado[p.id] === est ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                          >
                            {est}
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>

              </div>
            )}

            {/* SECCIÓN 3: COMUNICADOR SAAC Y BABY SIGNS */}
            {activeTab === 'comunicador' && (
              <div className="space-y-4">
                <div className="bg-purple-50 p-3.5 rounded-2xl border border-purple-100 text-center space-y-0.5">
                  <h2 className="font-bold text-xs text-purple-900">Tablero de Comunicación y Gestos</h2>
                  <p className="text-[11px] text-purple-700">Toca un pictograma para emitir el mensaje con voz clara.</p>
                </div>

                <div className="grid grid-cols-3 gap-2.5">
                  {[
                    { emoji: '🍼', titulo: 'Leche', frase: 'Quiero mi leche por favor' },
                    { emoji: '🚽', titulo: 'Baño', frase: 'Necesito ir al baño' },
                    { emoji: '🛌', titulo: 'Dormir', frase: 'Tengo mucho sueño' },
                    { emoji: '🧸', titulo: 'Jugar', frase: 'Quiero jugar con mis juguetes' },
                    { emoji: '🫂', titulo: 'Abrazo', frase: 'Necesito un abrazo' },
                    { emoji: '🛑', titulo: 'Parar / No', frase: 'No quiero más, por favor para' },
                    { emoji: '🎵', titulo: 'Música', frase: 'Pon mi música favorita' },
                    { emoji: '🌳', titulo: 'Paseo', frase: 'Quiero salir a dar un paseo' },
                    { emoji: '✨', titulo: 'Más', frase: 'Quiero más de esto' }
                  ].map((p, idx) => (
                    <button 
                      key={idx}
                      onClick={() => hablar(p.frase)}
                      className="p-3 bg-white border border-slate-200/80 rounded-2xl flex flex-col items-center justify-center gap-1 shadow-xs hover:border-purple-300 active:scale-95 transition"
                    >
                      <span className="text-3xl">{p.emoji}</span>
                      <span className="font-bold text-xs text-slate-800">{p.titulo}</span>
                    </button>
                  ))}
                </div>

                {/* Sección Baby Signs */}
                <div className="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2">
                  <h3 className="font-bold text-xs text-slate-800">Señas Puente (Baby Signs)</h3>
                  <div className="space-y-1.5 text-xs">
                    <div className="bg-white p-2.5 rounded-xl border border-slate-100">
                      <strong className="text-purple-700 block text-[11px]">Seña: "MÁS"</strong>
                      <p className="text-[10px] text-slate-600">Juntar las yemas de los dedos de ambas manos repetidamente frente al pecho.</p>
                    </div>
                    <div className="bg-white p-2.5 rounded-xl border border-slate-100">
                      <strong className="text-purple-700 block text-[11px]">Seña: "AGUA"</strong>
                      <p className="text-[10px] text-slate-600">Formar la letra W con 3 dedos y dar toques suaves en la barbilla.</p>
                    </div>
                  </div>
                </div>

              </div>
            )}

            {/* SECCIÓN 4: BITÁCORA E INFORME SEMANAL */}
            {activeTab === 'bitacora' && (
              <div className="space-y-4">
                
                {/* Formulario de registro */}
                <form onSubmit={agregarBitacora} className="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2">
                  <h3 className="font-bold text-xs text-slate-800">Registrar Observación Diaria</h3>
                  
                  <div className="flex gap-1.5 overflow-x-auto pb-1">
                    {['Observación Física', 'Comunicación', 'Sensorial', 'Terapia'].map((cat) => (
                      <button
                        type="button"
                        key={cat}
                        onClick={() => setCatNuevaNota(cat)}
                        className={`text-[10px] font-bold px-2.5 py-1 rounded-xl whitespace-nowrap transition ${catNuevaNota === cat ? 'bg-purple-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>

                  <textarea 
                    value={nuevaNota}
                    onChange={(e) => setNuevaNota(e.target.value)}
                    placeholder={`Escribe aquí lo que notaste en ${perfil.nombreHijo} hoy (ej. la pancita, el baño, una nueva seña)...`}
                    className="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-purple-500 bg-white resize-none h-16"
                  ></textarea>

                  <button 
                    type="submit"
                    className="w-full py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-xs shadow-xs transition"
                  >
                    + Guardar Observación
                  </button>
                </form>

                {/* TARJETA DE INFORME SEMANAL */}
                <div className="bg-gradient-to-br from-purple-50 to-indigo-50 p-4 rounded-2xl border border-purple-200 space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="bg-purple-200 text-purple-900 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase">
                      Informe Semanal Listo
                    </span>
                    <span className="text-[10px] text-purple-700 font-medium">Actualizado</span>
                  </div>

                  <h3 className="font-extrabold text-xs text-slate-900">Resumen Semanal de {perfil.nombreHijo}</h3>
                  <p className="text-[11px] text-slate-600 leading-relaxed">
                    Hemos agrupado tus observaciones de los últimos 7 días. Este resumen está listo para compartir con el pediatra o terapeuta.
                  </p>

                  <div className="bg-white/90 p-3 rounded-xl border border-purple-100 text-[11px] space-y-1 text-slate-700">
                    <p className="font-bold text-purple-950">📌 Puntos para la Consulta Médica:</p>
                    <ul className="list-disc pl-4 space-y-0.5 text-[10px]">
                      <li>Comentar firmeza persistente en la pancita durante las mañanas.</li>
                      <li>Revisión de sellado labial y avance con seña de "MÁS".</li>
                    </ul>
                  </div>
                </div>

                {/* Historial de registros */}
                <div className="space-y-2">
                  <h4 className="font-bold text-xs text-slate-400 uppercase tracking-wider">Historial de Registros</h4>
                  {registros.map((item) => (
                    <div key={item.id} className="bg-white p-3 rounded-2xl border border-slate-100 shadow-xs space-y-1">
                      <div className="flex justify-between items-center text-[10px]">
                        <span className="font-extrabold text-purple-700 bg-purple-50 px-2 py-0.5 rounded-md">
                          {item.categoria}
                        </span>
                        <span className="text-slate-400">{item.fecha}</span>
                      </div>
                      <p className="text-xs text-slate-700 leading-snug">{item.nota}</p>
                    </div>
                  ))}
                </div>

              </div>
            )}

            {/* SECCIÓN 5: CONFIGURACIÓN Y MARCO LEGAL */}
            {activeTab === 'legal' && (
              <div className="space-y-4">
                
                {/* Configuración de Nombres */}
                <div className="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2">
                  <h3 className="font-bold text-xs text-slate-800">Personalización del Acompañamiento</h3>
                  <div className="space-y-2 text-xs">
                    <div>
                      <label className="block text-[10px] text-slate-500 font-bold mb-0.5">Nombre de tu hijo/a:</label>
                      <input 
                        type="text" 
                        value={perfil.nombreHijo}
                        onChange={(e) => setPerfil({ ...perfil, nombreHijo: e.target.value })}
                        className="w-full p-2 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-purple-500"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] text-slate-500 font-bold mb-0.5">¿Cómo quieres que la app te llame?:</label>
                      <input 
                        type="text" 
                        value={perfil.nombreCuidador}
                        onChange={(e) => setPerfil({ ...perfil, nombreCuidador: e.target.value })}
                        className="w-full p-2 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-purple-500"
                      />
                    </div>
                  </div>
                </div>

                {/* Carta de Ajustes Razonables */}
                <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 space-y-2">
                  <h3 className="font-bold text-xs text-emerald-950">Educación Inclusiva (LGE México)</h3>
                  <p className="text-xs text-emerald-800 leading-relaxed">
                    Sustentado en los **Artículos 61 y 64 de la Ley General de Educación**. Garantiza el derecho de {perfil.nombreHijo} a recibir adaptaciones sin discriminación.
                  </p>

                  <button 
                    onClick={copiarSolicitudLegal}
                    className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-sm transition flex items-center justify-center gap-2 mt-2"
                  >
                    {copiado ? '¡Copiado al Portapapeles! ✅' : '📋 Copiar Carta para Escuela / USAER'}
                  </button>
                </div>

              </div>
            )}

          </main>

          {/* BARRA DE NAVEGACIÓN INFERIOR (5 BOTONES) */}
          <nav className="fixed bottom-0 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-slate-100 py-2 px-2 grid grid-cols-5 text-center z-20">
            <button 
              onClick={() => setActiveTab('inicio')} 
              className={`flex flex-col items-center gap-0.5 ${activeTab === 'inicio' ? 'text-purple-700 font-extrabold' : 'text-slate-400 font-medium'}`}
            >
              <span className="text-base">🏠</span>
              <span className="text-[10px]">Inicio</span>
            </button>

            <button 
              onClick={() => setActiveTab('pasos')} 
              className={`flex flex-col items-center gap-0.5 ${activeTab === 'pasos' ? 'text-purple-700 font-extrabold' : 'text-slate-400 font-medium'}`}
            >
              <span className="text-base">🌱</span>
              <span className="text-[10px]">Pasos</span>
            </button>

            <button 
              onClick={() => setActiveTab('comunicador')} 
              className={`flex flex-col items-center gap-0.5 ${activeTab === 'comunicador' ? 'text-purple-700 font-extrabold' : 'text-slate-400 font-medium'}`}
            >
              <span className="text-base">🗣️</span>
              <span className="text-[10px]">Hablar</span>
            </button>

            <button 
              onClick={() => setActiveTab('bitacora')} 
              className={`flex flex-col items-center gap-0.5 ${activeTab === 'bitacora' ? 'text-purple-700 font-extrabold' : 'text-slate-400 font-medium'}`}
            >
              <span className="text-base">📝</span>
              <span className="text-[10px]">Bitácora</span>
            </button>

            <button 
              onClick={() => setActiveTab('legal')} 
              className={`flex flex-col items-center gap-0.5 ${activeTab === 'legal' ? 'text-purple-700 font-extrabold' : 'text-slate-400 font-medium'}`}
            >
              <span className="text-base">⚙️</span>
              <span className="text-[10px]">Perfil</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AurelioCareApp />);
  </script>
</body>
</html>
